<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall Detail – UTAS HMS</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--gray-100); font-family: 'Georgia', 'Times New Roman', Times, serif; }

    /* ===== HERO ===== */
    .detail-hero {
      position: relative;
      height: 320px;
      overflow: hidden;
    }
    .detail-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .detail-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.60) 100%);
    }
    .detail-back-btn {
      position: absolute;
      top: 56px; left: 14px;
      width: 38px; height: 38px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;
      transition: background 0.2s;
    }
    .detail-back-btn:hover { background: rgba(255,255,255,0.35); }
    .detail-hero-info {
      position: absolute;
      bottom: 18px; left: 16px; right: 16px;
      z-index: 5;
    }
    .detail-hall-name {
      font-size: 30px;
      font-weight: 700;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      margin-bottom: 8px;
    }
    .detail-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-tag {
      padding: 4px 14px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      backdrop-filter: blur(8px);
    }
    .tag-gender { background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .tag-available { background: rgba(22,163,74,0.32); color: #86efac; border: 1px solid rgba(134,239,172,0.45); }

    /* ===== CONTENT ===== */
    .detail-content { padding: 16px; max-width: 640px; margin: 0 auto; }

    /* ===== PRICE CARD ===== */
    .price-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: var(--shadow-md);
    }
    .price-header {
      background: var(--gray-50);
      padding: 16px 20px;
      text-align: center;
      border-bottom: 1px solid var(--gray-100);
    }
    .price-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--gray-400);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
    }
    .price-amount {
      font-size: 44px;
      font-weight: 900;
      color: var(--gray-900);
      line-height: 1;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
    }
    .price-currency {
      font-size: 24px;
      font-weight: 700;
      vertical-align: top;
      line-height: 1.5;
    }
    .price-body { padding: 16px 20px; }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .detail-row:last-of-type { border-bottom: none; padding-bottom: 0; }
    .detail-row-left {
      display: flex; align-items: center; gap: 10px;
      color: var(--gray-500); font-size: 14px;
    }
    .detail-row-val { font-size: 14px; font-weight: 700; }
    .val-blue  { color: var(--blue); }
    .val-dark  { color: var(--gray-800); }
    .val-green { color: var(--green); display: flex; align-items: center; gap: 6px; }
    .val-green::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
    }

    .book-now-btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; padding: 16px;
      background: var(--blue);
      color: #fff; border: none;
      border-radius: var(--radius-full);
      font-size: 17px; font-weight: 700;
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      cursor: pointer; margin-top: 18px;
      transition: all 0.2s;
    }
    .book-now-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.35);
    }
  </style>
</head>
<body>

  <!-- ===== TOP NAV ===== -->
  <nav class="top-nav">
    <div class="nav-logo">
      <svg width="32" height="32" viewBox="0 0 36 36" fill="none" style="border-radius:8px;">
        <circle cx="18" cy="18" r="16" fill="#fff" stroke="#8B0000" stroke-width="2"/>
        <circle cx="18" cy="18" r="9" fill="#8B0000"/>
        <circle cx="18" cy="18" r="4" fill="#fff"/>
      </svg>
      <div class="nav-logo-text">
        <div class="brand">UTAS</div>
        <div class="sub">Accommodation</div>
      </div>
    </div>
    <button class="hamburger" onclick="openSidebar()">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ===== SIDEBAR ===== -->
  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" style="border-radius:8px;background:#fff;">
          <circle cx="18" cy="18" r="14" fill="#fff" stroke="#8B0000" stroke-width="1.5"/>
          <circle cx="18" cy="18" r="7" fill="#8B0000"/>
          <circle cx="18" cy="18" r="3" fill="#fff"/>
        </svg>
        <div class="sidebar-logo-text">
          <div class="brand">UTAS HMS</div>
          <div class="sub">STUDENT PORTAL</div>
        </div>
      </div>
      <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>
    <div class="sidebar-nav">
      <div class="sidebar-section-label">Accommodation</div>
      <a href="dashboard.html" class="sidebar-item"><span class="icon">📊</span> Dashboard</a>
      <a href="halls.html"     class="sidebar-item active"><span class="icon">🏢</span> Browse Halls</a>
      <a href="#"              class="sidebar-item"><span class="icon">🔖</span> My Bookings</a>
      <a href="#"              class="sidebar-item"><span class="icon">💵</span> Payments</a>
      <a href="#"              class="sidebar-item"><span class="icon">🔔</span> Notifications</a>
    </div>
  </aside>

  <!-- ===== HERO ===== -->
  <div class="detail-hero">
    <img src="hall-room.jpg" alt="Hall Room" />
    <div class="detail-hero-overlay"></div>
    <a href="halls.html" class="detail-back-btn">←</a>
    <div class="detail-hero-info">
      <div class="detail-hall-name">ECOWAS Hall</div>
      <div class="detail-tags">
        <span class="detail-tag tag-gender">Male Hall</span>
        <span class="detail-tag tag-available">12 Rooms Available</span>
      </div>
    </div>
  </div>

</body>
</html>
